<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../font/css/notosanskr.css">
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="login.css">
    <title>서브웨이 로그인</title>
</head>
<body>
    <div id="wrap">
        <header class="login_header">
            <button type="button" class="back_btn">
                <span class="sr-only">이전 페이지</span>
            </button>
            <h1>로그인</h1>
        </header>

        <main>
            <section class="login_intro">
                <h2>
                    <span>서비스 이용을 위해</span>
                    <span>로그인해주세요.</span>
                </h2>

                <img class="subway_logo" src="img/logo.png" alt="SUBWAY">
            </section>

            <section class="login_method">
                <h2 class="sr-only">로그인 방법</h2>

                <div class="login_button_list">
                    <button type="button" class="login_btn kakao_btn">
                        <span>카카오로 시작하기</span>
                    </button>

                    <button type="button" class="login_btn naver_btn">
                        <span>네이버로 시작하기</span>
                    </button>

                    <button type="button" class="login_btn id_btn">
                        아이디로 시작하기
                    </button>
                </div>

                <div class="other_login">
                    <p>기존 로그인 수단을 사용할 수 없나요?</p>
                </div>
            </section>

            <section class="account_switch">
                <h2 class="account_switch_title">
                    <span>계정전환</span>
                    <span class="switch_icon" aria-hidden="true">i</span>
                </h2>

                <p class="account_switch_text">
                    기존 이메일 계정을 SNS or 아이디 계정으로 전환해 주세요.
                </p>

                <button type="button" class="switch_btn">
                    전환하기
                </button>
            </section>
        </main>
    </div>
</body>
</html>
