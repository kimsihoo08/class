<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엘엑스하우시스 리뉴얼 포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <section class="hero-sec" aria-label="메인 비주얼">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="img/hero1.png" alt="할인 배너" class="pc">
                            <img src="img/m_visual01.png" alt="모바일 할인 배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/hero2.png" alt="달콤고구마" class="pc">
                            <img src="img/m_visual02.png" alt="모바일 달콤고구마" class="mo">
                        </div>
                    </div>

                    <div class="visual-controls" aria-label="메인 비주얼 슬라이드 제어">
                        <span class="visual-current" aria-live="polite">01</span>
                        <div class="visual-progress" role="progressbar" aria-label="슬라이드 진행 상태" aria-valuemin="1" aria-valuemax="2" aria-valuenow="1">
                            <span class="visual-progress-bar"></span>
                        </div>
                        <span class="visual-total">02</span>

                        <div class="visual-arrows">
                            <button type="button" class="visual-prev" aria-label="이전 슬라이드">
                                <span aria-hidden="true"></span>
                            </button>
                            <button type="button" class="visual-next" aria-label="다음 슬라이드">
                                <span aria-hidden="true"></span>
                            </button>
                        </div>

                        <button type="button" class="visual-toggle" aria-label="자동 재생 일시정지" aria-pressed="false">
                            <span class="pause-icon" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>
            </section>

            <section class="products-sec" aria-labelledby="products-title">
                <div class="products-heading">
                    <h2 id="products-title">PRODUCTS</h2>
                    <a class="products-all" href="#" aria-label="전체 제품 보기">전체 바로가기 <span aria-hidden="true">↗</span></a>
                </div>

                <div class="products-inner">
                    <div class="products-main-tabs" role="tablist" aria-label="제품 대분류">
                        <button class="products-main-tab is-active" type="button" role="tab" aria-selected="true">건축장식자재</button>
                        <button class="products-main-tab" type="button" role="tab" aria-selected="false">LONCHEL</button>
                        <button class="products-main-tab" type="button" role="tab" aria-selected="false">수입주방</button>
                        <button class="products-main-tab" type="button" role="tab" aria-selected="false">자동차소재부품</button>
                        <button class="products-main-tab" type="button" role="tab" aria-selected="false">산업용 필름</button>
                        <button class="products-main-tab" type="button" role="tab" aria-selected="false">신재생 에너지</button>
                        <button class="products-main-tab" type="button" role="tab" aria-selected="false">단열재</button>
                    </div>

                    <div class="products-sub-tabs" aria-label="건축장식자재 제품 분류">
                        <button type="button">창호</button>
                        <button type="button">벽지&amp;벽장재</button>
                        <button type="button">바닥재(주거)</button>
                        <button class="is-active" type="button" aria-current="true">바닥재(산업)</button>
                        <button type="button">인테리어필름</button>
                        <button type="button">인테리어스톤</button>
                        <button type="button">중문</button>
                        <button type="button">도어</button>
                        <button type="button">키친</button>
                        <button type="button">빌트인 시스템</button>
                        <button type="button">보드</button>
                    </div>

                    <div class="products-grid">
                        <article class="product-card">
                            <div class="product-image"><img src="https://www.figma.com/api/mcp/asset/aec27023-06dd-4134-8fd9-a89308859b70.png" alt="미스티 콘크리트 바닥재"></div>
                            <div class="product-info">
                                <p class="product-category">LVT ㅣ LVT 프리미엄 5T(프레스티지)</p>
                                <h3>미스티 콘크리트</h3>
                                <p class="product-code">PTT6950</p>
                                <button class="product-compare" type="button">비교하기</button>
                            </div>
                        </article>
                        <article class="product-card">
                            <div class="product-image"><img src="https://www.figma.com/api/mcp/asset/adac41c4-9eec-4746-94b8-16a100035bf5.png" alt="모던 그레이 바닥재"></div>
                            <div class="product-info">
                                <p class="product-category">LVT ㅣ LVT 프리미엄 5T(프레스티지)</p>
                                <h3>모던 그레이</h3>
                                <p class="product-code">PTT6951</p>
                                <button class="product-compare" type="button">비교하기</button>
                            </div>
                        </article>
                        <article class="product-card">
                            <div class="product-image"><img src="https://www.figma.com/api/mcp/asset/7bd032d4-ae0d-40a3-9bfe-3a9636797aea.png" alt="샌드 베이지 바닥재"></div>
                            <div class="product-info">
                                <p class="product-category">LVT ㅣ LVT 프리미엄 5T(프레스티지)</p>
                                <h3>샌드 베이지</h3>
                                <p class="product-code">PTT6952</p>
                                <button class="product-compare" type="button">비교하기</button>
                            </div>
                        </article>
                        <article class="product-card">
                            <div class="product-image"><img src="https://www.figma.com/api/mcp/asset/8b6a013f-d06c-4af0-913e-3fbc55ec11e0.png" alt="솔리드 칩 바닥재"></div>
                            <div class="product-info">
                                <p class="product-category">LVT ㅣ LVT 프리미엄 5T(프레스티지)</p>
                                <h3>솔리드 칩</h3>
                                <p class="product-code">PTT6953</p>
                                <button class="product-compare" type="button">비교하기</button>
                            </div>
                        </article>
                    </div>
                    <div class="products-track" aria-hidden="true"><span></span></div>
                </div>
            </section>
        </main>
        <footer>&copy;</footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const visual = document.querySelector('.hero-sec .visual');
            const nextButton = document.querySelector('.visual-next');
            const prevButton = document.querySelector('.visual-prev');
            const visualCurrent = document.querySelector('.visual-current');
            const visualTotal = document.querySelector('.visual-total');
            const visualProgress = document.querySelector('.visual-progress');
            const visualProgressBar = document.querySelector('.visual-progress-bar');
            const visualToggle = document.querySelector('.visual-toggle');
            const visualToggleIcon = document.querySelector('.pause-icon');

            if (!visual || typeof window.Swiper === 'undefined') {
                console.error('슬라이드 초기화 실패: Swiper 라이브러리 또는 슬라이드 요소를 찾지 못했습니다.');
                return;
            }

            function updateVisualControls(swiper) {
                const total = 2;
                const current = swiper.realIndex + 1;
                visualCurrent.textContent = String(current).padStart(2, '0');
                visualTotal.textContent = String(total).padStart(2, '0');
                visualProgressBar.style.width = (current / total * 100) + '%';
                visualProgress.setAttribute('aria-valuemax', total);
                visualProgress.setAttribute('aria-valuenow', current);
            }

            const swiperHero = new window.Swiper(visual, {
                direction: 'horizontal',
                loop: true,
                speed: 600,
                autoplay: {
                    delay: 5000,
                    disableOnInteraction: false
                },
                navigation: {
                    nextEl: nextButton,
                    prevEl: prevButton
                },
                on: {
                    init: updateVisualControls,
                    slideChange: updateVisualControls
                }
            });

            nextButton.addEventListener('click', function (event) {
                event.preventDefault();
                swiperHero.slideNext();
            });
            prevButton.addEventListener('click', function (event) {
                event.preventDefault();
                swiperHero.slidePrev();
            });

            visualToggle.addEventListener('click', function () {
                const isPaused = visualToggle.getAttribute('aria-pressed') === 'true';
                if (isPaused) {
                    swiperHero.autoplay.start();
                    visualToggle.setAttribute('aria-pressed', 'false');
                    visualToggle.setAttribute('aria-label', '자동 재생 일시정지');
                    visualToggleIcon.classList.remove('is-play');
                } else {
                    swiperHero.autoplay.stop();
                    visualToggle.setAttribute('aria-pressed', 'true');
                    visualToggle.setAttribute('aria-label', '자동 재생 시작');
                    visualToggleIcon.classList.add('is-play');
                }
            });
        });
    </script>
</body>
</html>
